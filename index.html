<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/png" href="圆logo.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="title">吴易云音乐</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <audio id="audioPlayer" preload="metadata"></audio>

  <!-- 顶部导航 -->
  <header class="topbar">
    <div class="logo">
      <img src="圆logo.png" alt="吴易云音乐" />
    </div>
    <nav class="nav">
      <a href="#" class="active">首页</a>
      <a href="https://music.163.com/#/playlist?id=2146340838&uct2=U2FsdGVkX1/+cUB9VIOKNhnCyiKPz7DsIM4VrRS0LCE=">歌单</a>
      <a href="about.html">吴哥的简介</a>
    </nav>
  </header>

  <!-- 主体 -->
  <main class="container">
    <div class="content-layout">
      <div class="mobile-swipe-hint" id="mobileSwipeHint" hidden>
        <span class="mobile-swipe-hint-text">左滑查看留言墙，再滑回来</span>
      </div>
      <div class="mobile-panel-switcher" id="mobilePanelSwitcher" aria-label="移动端内容切换">
        <button type="button" class="mobile-panel-dot is-active" data-mobile-panel-target="0" aria-label="查看歌曲列表"></button>
        <button type="button" class="mobile-panel-dot" data-mobile-panel-target="1" aria-label="查看留言墙"></button>
      </div>
      <div class="main-column">
        <section class="playlist-info card">
          <div class="cover" id="playlistCover">
            <img src="cover.jpg" alt="专辑封面" />
          </div>
          <div class="playlist-text">
            <h1>吴哥的的音乐</h1>
            <p class="desc">这是一个我自己模仿网易云全栈搭建的demo，可以给你们听听我喜欢的歌
            </p>
            <div class="stats">
              <span id="songCount">0 首歌曲</span>
            </div>
            <div class="actions">
              <button id="playAllBtn" class="btn primary">播放全部</button>
              <button id="messageWallBtn" class="btn btn-with-icon" type="button">
                <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M6 18.5V21l3.2-2H18a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H6A3 3 0 0 0 3 7v8a3 3 0 0 0 3 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>留言墙</span>
              </button>
            </div>
          </div>
        </section>

        <section class="song-section card">
          <div class="section-title">
            <h2>歌曲列表</h2>
            <div class="search-box">
              <input id="searchInput" type="text" placeholder="搜索歌曲/歌手/专辑" />
              <button id="searchBtn" class="search-icon-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              </button>
            </div>
          </div>
          <table class="song-table">
            <thead>
              <tr>
                <th>#</th>
                <th>操作</th>
                <th>歌曲标题</th>
                <th>歌手</th>
                <th>专辑</th>
                <th>时长</th>
              </tr>
            </thead>
            <tbody id="songList"></tbody>
          </table>
        </section>
      </div>

      <aside class="message-wall card">
        <div class="message-wall-head">
          <div>
            <p class="message-wall-kicker">Message Wall</p>
            <h2>留言墙</h2>
          </div>
          <span class="message-wall-badge">24h</span>
        </div>
        <p class="message-wall-intro">把想说的话贴在这里，像是一面会发光的小墙，随手记录今天听歌时的心情。</p>
        <form class="message-form" id="messageForm">
          <button type="button" class="message-user-entry" id="messageUserEntry">
            <span class="message-user-prefix">你好</span>
            <span class="message-user-name" id="messageUserName">匿名用户</span>
            <span class="message-user-suffix">，写点什么</span>
          </button>
          <textarea id="messageInput" class="message-input" rows="4" maxlength="500" placeholder="比如：今天最想循环哪首歌？"></textarea>
          <div class="message-upload-row">
            <label class="message-upload-btn" for="messageImageInput">上传图片</label>
            <input id="messageImageInput" class="message-image-input" type="file" accept="image/*" />
            <span class="message-upload-tip" id="messageImageTip">支持图片，大小不能超过 3MB</span>
          </div>
          <div class="message-image-preview" id="messageImagePreview" hidden></div>
          <div class="message-form-footer">
            <span class="message-form-tip">点击高亮名字可修改身份，图片大小不能超过 3MB。</span>
            <button type="submit" class="btn primary">贴上墙</button>
          </div>
        </form>
        <div class="message-list" id="messageList"></div>
      </aside>
    </div>
  </main>

  <!-- 底部播放器 -->
  <footer class="player-bar" id="playerBar">
    <div class="player-progress-shell">
      <div class="player-progress-track" id="progressBar" aria-label="播放进度条">
        <div class="player-progress-fill" id="progressInner"></div>
        <div class="player-progress-thumb" id="progressThumb"></div>
      </div>
    </div>

    <div class="player-left">
      <div class="player-cover" id="playerCover">♪</div>
      <div class="player-meta">
        <div class="player-title" id="playerTitle">
          <div class="player-title-marquee" id="playerTitleMarquee">
            <span class="player-title-text" id="playerTitleText">还没有播放歌曲</span>
            <span class="player-title-text player-title-text-ghost" id="playerTitleTextGhost" aria-hidden="true"></span>
          </div>
        </div>
        <div class="player-artist" id="playerArtist">请选择一首歌</div>
      </div>
      <span id="currentTime">00:00</span>
      <span id="totalTime">00:00</span>
    </div>

    <div class="player-center">
      <button id="prevBtn" class="control-btn icon-control-btn" aria-label="上一首" title="上一首">
        <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 6v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M18 6 9.5 12 18 18V6z" fill="currentColor"/>
        </svg>
      </button>
      <button id="playPauseBtn" class="control-btn main-btn icon-control-btn" aria-label="播放" title="播放">
        <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 6.5v11l9-5.5-9-5.5z" fill="currentColor"/>
        </svg>
      </button>
      <button id="nextBtn" class="control-btn icon-control-btn" aria-label="下一首" title="下一首">
        <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M17 6v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M6 6v12l8.5-6L6 6z" fill="currentColor"/>
        </svg>
      </button>
    </div>

    <div class="player-right">
      <div class="volume-control">
        <button id="volumeBtn" class="volume-btn" aria-label="切换静音" title="切换静音">
          <svg class="volume-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 10h4l5-4v12l-5-4H5z" fill="currentColor"/>
            <path d="M17 9a4 4 0 0 1 0 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M19.5 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <div class="volume-popover">
          <div class="volume-bar" id="volumeBar" aria-label="音量控制条">
            <div class="volume-inner" id="volumeInner"></div>
            <div class="volume-thumb" id="volumeThumb"></div>
          </div>
        </div>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
